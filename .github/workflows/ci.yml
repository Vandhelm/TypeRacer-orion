# Intégration continue (TECH-09) : à chaque push et pull request, lint, types, tests unitaires
# et de régression, build Next.js, puis smoke tests sur un vrai Postgres.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion
          POSTGRES_DB: orion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://orion:orion@localhost:5432/orion
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Types (tsc --noEmit)
        run: bun run typecheck

      # Tests unitaires et de régression, lancés une seule fois et rattachés aux exigences par l'ID qui
      # ouvre leur nom (`describe("AUTH-02 — …")`) : tableau dans le résumé du job, JSON pour la QA.
      # --strict : tout test en échec fait échouer l'étape, avec ou sans ID.
      - name: Tests unitaires et par exigence
        run: bun run test:requirements --strict

      - name: Rapport des tests par exigence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: requirement-tests
          path: reports/requirement-tests.json
          if-no-files-found: ignore

      # TECH-06 : le serveur temps réel se regroupe en un seul fichier, comme dans son image Fly.io.
      # Ses tests d'intégration (bun test) le lancent eux-mêmes : pas de service à démarrer ici.
      - name: Build du serveur temps réel
        run: bun run realtime:build

      # TECH-01 : l'application est construite et servie par Next.js. Un build en échec arrête la CI.
      - name: Build Next.js
        run: bun run next:build

      # Smoke tests contre `next start` (base jetable orion_smoke), sur le build de l'étape précédente.
      - name: Smoke tests
        run: bun run test:smoke
        env:
          SMOKE_SKIP_BUILD: "1"

      # TECH-02 interdit tout fichier .js/.jsx.
      - name: Aucun fichier JavaScript (TECH-02)
        run: bun run check:no-js
