# Serveur temps réel (TECH-06) sur Fly.io, offre gratuite (TECH-08). Le site reste sur Vercel.
# Rien n'est déployé par le dépôt : voir docs/ARCHITECTURE.md, « Déployer le serveur temps réel ».
# L'état des salles est en mémoire : une seule machine (fly deploy --ha=false, fly scale count 1).
app = "typeracer-orion"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile.realtime"

[env]
  REALTIME_PORT = "8080"
  REALTIME_ALLOWED_ORIGINS = "https://vandhelm.com,https://www.vandhelm.com"

[http_service]
  internal_port = 8080
  force_https = true
  # Sans connexion ouverte, la machine s'arrête (aucune salle à perdre) et redémarre à la connexion suivante.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
